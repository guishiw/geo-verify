name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # 浏览器辅助插件的 JS 测试（tests/test_extension.py）用 Node 运行，没有 Node 会失败而不是跳过
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make setup
      - run: make check
